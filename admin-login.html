<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AURORA ATELIER — Admin Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>👑</text></svg>">
  
  <style>
    :root {
      --gold-primary: #C9A227;
      --gold-dark: #9A7B1C;
      --gold-light: #F4E8C1;
      --bg-light: #F8F9FA;
      --text-dark: #111827;
      --text-muted: #6B7280;
      --border-color: #E5E7EB;
      --font-serif: 'Cormorant Garamond', Georgia, serif;
      --font-sans: 'Plus Jakarta Sans', system-ui, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-sans);
      background: radial-gradient(circle at 50% 20%, #201D19 0%, #0D0C0B 75%, #050505 100%);
      color: #FFF;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      -webkit-font-smoothing: antialiased;
    }

    .admin-header {
      padding: 1.25rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .admin-logo {
      font-family: var(--font-serif);
      font-size: 1.6rem;
      letter-spacing: 0.15em;
      color: var(--gold-light);
      text-decoration: none;
      font-weight: 700;
    }

    .login-container {
      max-width: 440px;
      width: 90%;
      margin: 2rem auto;
      background: #FFFFFF;
      color: var(--text-dark);
      border-radius: 16px;
      border: 1px solid var(--gold-primary);
      padding: 2.5rem 2rem;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    .login-icon { font-size: 3rem; margin-bottom: 0.75rem; }
    .login-title { font-family: var(--font-serif); font-size: 1.9rem; margin-bottom: 0.35rem; color: #111827; }
    .login-subtitle { font-size: 0.88rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 1.75rem; }

    .admin-input {
      width: 100%;
      padding: 0.85rem 1rem;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      outline: none;
      transition: border 0.2s;
      text-align: center;
      letter-spacing: 0.1em;
    }
    .admin-input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 0 3px rgba(201, 162, 39, 0.2);
    }

    .btn-gold {
      background: var(--gold-primary);
      color: #111827;
      font-weight: 700;
      padding: 0.85rem 1.25rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.2s;
      width: 100%;
    }
    .btn-gold:hover { background: #D8B237; transform: translateY(-1px); }

    .btn-demo {
      background: rgba(201, 162, 39, 0.1);
      color: var(--gold-dark);
      border: 1px solid var(--gold-primary);
      font-weight: 700;
      padding: 0.75rem 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      width: 100%;
      margin-top: 0.5rem;
    }
    .btn-demo:hover { background: rgba(201, 162, 39, 0.18); }

    .footer-text {
      text-align: center;
      padding: 1.5rem;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.5);
    }
  </style>
</head>
<body>

  <header class="admin-header">
    <a href="index.html" class="admin-logo">AURORA</a>
    <a href="index.html" style="color:var(--gold-light); font-size:0.85rem; text-decoration:none;">&larr; Return to Boutique</a>
  </header>

  <main>
    <div class="login-container">
      <div class="login-icon">👑</div>
      <h1 class="login-title">Atelier Staff Login</h1>
      <p class="login-subtitle">
        Enter your administrative passkey to access incoming orders, manage dispatch tracking, and schedule client deliveries.
      </p>

      <div id="loginErrorMessage" style="display:none; background:#FEE2E2; border:1px solid #FCA5A5; color:#B91C1C; padding:0.6rem; border-radius:6px; font-size:0.85rem; margin-bottom:1rem;"></div>

      <form onsubmit="handleLoginSubmit(event)" style="display:flex; flex-direction:column; gap:0.9rem;">
        <input type="password" id="loginPasskey" class="admin-input" placeholder="Passkey (AURORA2026)" required autofocus>
        
        <button type="submit" class="btn-gold">
          Unlock Operations Dashboard &rarr;
        </button>

        <button type="button" class="btn-demo" onclick="instantLoginDemo()">
          ⚡ Instant One-Click Unlock (Demo)
        </button>
      </form>
    </div>
  </main>

  <footer class="footer-text">
    &copy; 2026 Aurora Maison Atelier. Restricted Administrative Operations.
  </footer>

  <script>
    function handleLoginSubmit(e) {
      e.preventDefault();
      const pass = (document.getElementById('loginPasskey')?.value || '').trim().toUpperCase();
      const errEl = document.getElementById('loginErrorMessage');

      if (pass === 'AURORA2026' || pass === 'ADMIN' || pass === 'ADMIN123') {
        sessionStorage.setItem('aurora_admin_logged_in', 'true');
        window.location.href = 'admin.html';
      } else {
        if (errEl) {
          errEl.style.display = 'block';
          errEl.innerText = '❌ Invalid Passkey. Restricted to Atelier Management.';
        }
      }
    }

    function instantLoginDemo() {
      sessionStorage.setItem('aurora_admin_logged_in', 'true');
      window.location.href = 'admin.html';
    }
  </script>
</body>
</html>
